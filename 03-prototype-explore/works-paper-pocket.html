<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Pocket-mounted prints — works interaction study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #16265e;
        --ink-soft: #2a3a7a;
        --ink-muted: rgba(22, 38, 94, 0.2);
        --ink-faint: rgba(22, 38, 94, 0.08);
        --paper: #f4f1ea;
        --paper-soft: #ebe6d9;
        --ease-paper: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { box-sizing: border-box; }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        background: var(--paper);
        font-family: Fraunces, Georgia, serif;
      }

      button, a { -webkit-tap-highlight-color: transparent; }

      .canvas {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }

      .backdrop {
        position: fixed;
        z-index: 0;
        top: 0;
        left: 50%;
        width: calc(100svh * 2600 / 1812);
        height: 100svh;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .backdrop img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: drop-shadow(0 12px 28px rgba(22, 38, 94, 0.16));
      }

      .backdrop::after {
        content: '';
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, var(--paper) 18%, transparent);
      }

      .review-bar {
        position: fixed;
        z-index: 20;
        top: clamp(12px, 2svh, 20px);
        left: clamp(16px, 3vw, 36px);
        right: clamp(16px, 3vw, 36px);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
      }

      .review-bar > * { pointer-events: auto; }

      .back-link,
      .concept-label {
        min-height: 36px;
        padding: 10px 12px;
        border: 1px solid var(--ink-muted);
        background: color-mix(in srgb, var(--paper) 94%, transparent);
        color: var(--ink);
        font: 400 10px/1.25 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background-color 160ms ease-out, border-color 160ms ease-out;
      }

      .back-link:hover {
        background: var(--paper);
        border-color: var(--ink);
      }

      .back-link:focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: 3px;
      }

      .concept-label { margin: 0; text-align: right; }

      .content {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(56px, 7svh, 80px) clamp(24px, 5vw, 60px);
      }

      .spread {
        width: 100%;
        max-width: 118svh;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: clamp(40px, 8svh, 96px);
        row-gap: clamp(16px, 2.4svh, 28px);
        align-items: start;
      }

      .project {
        position: relative;
        width: 100%;
        max-width: 46svh;
      }

      .project:nth-child(odd) { justify-self: end; }
      .project:nth-child(even) { justify-self: start; }

      .project:has(.specimen:hover),
      .project:has(.specimen:focus-visible),
      .project:has(.specimen[aria-pressed='true']) { z-index: 5; }

      .specimen {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: none;
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .specimen:focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: 5px;
      }

      /* The page-mounted backing and two corner pockets never move. Only the
         print lifts. Its generous bottom paper margin keeps both pockets off
         the full-color screenshot, even while the print slides upward. */
      .mount {
        position: relative;
        display: block;
        perspective: 900px;
      }

      .backing {
        position: absolute;
        z-index: 0;
        inset: 3px 2px -3px;
        border: 1px solid var(--ink-muted);
        background: var(--paper-soft);
        box-shadow: 0 2px 8px rgba(22, 38, 94, 0.07);
      }

      .print {
        position: relative;
        z-index: 1;
        display: block;
        padding: 7px 7px 22px;
        border: 1px solid var(--ink-muted);
        background: var(--paper);
        box-shadow: 0 2px 8px rgba(22, 38, 94, 0.1);
        transform: translateY(0) rotateX(0);
        transform-origin: 50% 100%;
        transition: transform 360ms var(--ease-paper), box-shadow 360ms var(--ease-paper);
        will-change: transform;
      }

      .image-frame {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        border: 1px solid var(--ink-muted);
        background: var(--paper);
      }

      .image-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        user-select: none;
        -webkit-user-drag: none;
      }

      .pocket {
        position: absolute;
        z-index: 2;
        bottom: -1px;
        left: -1px;
        width: 23px;
        height: 23px;
        pointer-events: none;
        filter: drop-shadow(1px -1px 1px rgba(22, 38, 94, 0.09));
      }

      .pocket.right {
        left: auto;
        right: -1px;
        transform: scaleX(-1);
      }

      .pocket path {
        fill: var(--paper-soft);
        stroke: var(--ink);
        stroke-width: 0.65;
        vector-effect: non-scaling-stroke;
      }

      .caption {
        display: flex;
        flex-direction: column;
        gap: clamp(3px, 0.5svh, 6px);
        padding: clamp(8px, 1.2svh, 12px) 7px 0;
      }

      .fig {
        color: var(--ink-soft);
        font: 400 11px/1.2 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .title {
        display: block;
        margin: 0;
        font-size: clamp(1.05rem, 1.9svh, 1.5rem);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }

      .proof {
        display: block;
        padding-top: clamp(5px, 0.8svh, 8px);
        border-top: 1px solid var(--ink-muted);
        font-size: clamp(0.8rem, 1.3svh, 1rem);
        line-height: 1.1;
      }

      .folio {
        position: fixed;
        z-index: 10;
        right: clamp(20px, 3vw, 40px);
        bottom: clamp(14px, 2svh, 24px);
        margin: 0;
        padding: 8px 10px;
        border: 1px solid var(--ink-muted);
        background: color-mix(in srgb, var(--paper) 94%, transparent);
        color: var(--ink-soft);
        font: 400 10px/1.3 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .touch-note { display: none; }

      @media (hover: hover) and (pointer: fine) {
        .specimen:hover .print {
          transform: translateY(-10px) rotateX(2deg);
          box-shadow: 0 14px 22px rgba(22, 38, 94, 0.15);
        }
      }

      .specimen:focus-visible .print,
      .specimen[aria-pressed='true'] .print {
        transform: translateY(-10px) rotateX(2deg);
        box-shadow: 0 14px 22px rgba(22, 38, 94, 0.15);
      }

      @media (max-width: 1100px) {
        .content {
          display: block;
          min-height: 100svh;
          padding-top: 86px;
          padding-bottom: 80px;
        }

        .spread {
          max-width: 40rem;
          margin: 0 auto;
          display: flex;
          flex-direction: column;
          gap: clamp(28px, 6vw, 52px);
        }

        .project { max-width: none; }
        .backdrop::after { background: color-mix(in srgb, var(--paper) 55%, transparent); }
        .folio { display: none; }

        .touch-note {
          display: block;
          max-width: 40rem;
          margin: 0 auto 24px;
          color: var(--ink-soft);
          font: 400 11px/1.45 'JetBrains Mono', monospace;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
      }

      @media (max-width: 640px) {
        .review-bar { position: absolute; }
        .concept-label { max-width: 132px; }
        .backdrop img { opacity: 0.6; }
        .fig { font-size: 10px; white-space: normal; }
        .pocket { width: 21px; height: 21px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .print,
        .specimen:hover .print,
        .specimen:focus-visible .print,
        .specimen[aria-pressed='true'] .print {
          transform: none;
          transition: box-shadow 180ms linear;
        }

        .specimen:focus-visible .print,
        .specimen[aria-pressed='true'] .print {
          box-shadow: 0 6px 14px rgba(22, 38, 94, 0.17);
        }
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="backdrop" aria-hidden="true">
        <img src="../site/public/canvas/open-notebook.webp" alt="" draggable="false" />
      </div>

      <nav class="review-bar" aria-label="Prototype navigation">
        <a class="back-link" href="works-paper-concepts.html" target="_top"><span aria-hidden="true">←</span> All concepts</a>
        <p class="concept-label">02 / Pocket-mounted prints</p>
      </nav>

      <main class="content">
        <p class="touch-note">Tap a print to lift it. Tap again to settle.</p>
        <div class="spread" aria-label="Project print interaction study">
          <article class="project">
            <button class="specimen" type="button" aria-label="Lift Control Hub AI Assistant print" aria-pressed="false">
              <span class="mount">
                <span class="backing" aria-hidden="true"></span>
                <span class="print">
                  <span class="image-frame"><img src="../site/public/canvas/mockups/chai.png" alt="" draggable="false" /></span>
                </span>
                <svg class="pocket left" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
                <svg class="pocket right" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
              </span>
              <span class="caption">
                <span class="fig">fig. 01 · 2024–2025 · Full case study</span>
                <span class="title">Control Hub AI Assistant</span>
                <span class="proof">3% → 18% adoption</span>
              </span>
            </button>
          </article>

          <article class="project">
            <button class="specimen" type="button" aria-label="Lift Control Hub Agentic print" aria-pressed="false">
              <span class="mount">
                <span class="backing" aria-hidden="true"></span>
                <span class="print">
                  <span class="image-frame"><img src="../site/public/canvas/mockups/control-hub-agentic.png" alt="" draggable="false" /></span>
                </span>
                <svg class="pocket left" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
                <svg class="pocket right" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
              </span>
              <span class="caption">
                <span class="fig">fig. 02 · 2026 · In progress</span>
                <span class="title">Control Hub Agentic</span>
                <span class="proof">Set the agentic direction</span>
              </span>
            </button>
          </article>

          <article class="project">
            <button class="specimen" type="button" aria-label="Lift Ebb print" aria-pressed="false">
              <span class="mount">
                <span class="backing" aria-hidden="true"></span>
                <span class="print">
                  <span class="image-frame"><img src="../site/public/canvas/mockups/ebb.png" alt="" draggable="false" /></span>
                </span>
                <svg class="pocket left" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
                <svg class="pocket right" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
              </span>
              <span class="caption">
                <span class="fig">fig. 03 · July 2026 · Independent iOS app</span>
                <span class="title">Ebb</span>
                <span class="proof">A pause between the tap and the feed</span>
              </span>
            </button>
          </article>

          <article class="project">
            <button class="specimen" type="button" aria-label="Lift SAP Fieldglass print" aria-pressed="false">
              <span class="mount">
                <span class="backing" aria-hidden="true"></span>
                <span class="print">
                  <span class="image-frame"><img src="../site/public/canvas/mockups/sap-fieldglass.png" alt="" draggable="false" /></span>
                </span>
                <svg class="pocket left" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
                <svg class="pocket right" viewBox="0 0 24 24" aria-hidden="true"><path d="M0.5 0.5v23h23z" /></svg>
              </span>
              <span class="caption">
                <span class="fig">fig. 04 · 2020–2024 · Earlier work</span>
                <span class="title">SAP Fieldglass</span>
                <span class="proof">Simplified vender management workflows</span>
              </span>
            </button>
          </article>
        </div>
      </main>

      <p class="folio">Hover, focus, or tap a print to pull it forward · Esc to reset</p>
    </div>

    <script>
      const prints = [...document.querySelectorAll('.specimen')];
      prints.forEach((print) => {
        print.addEventListener('click', () => {
          const shouldLift = print.getAttribute('aria-pressed') !== 'true';
          prints.forEach((other) => other.setAttribute('aria-pressed', 'false'));
          print.setAttribute('aria-pressed', String(shouldLift));
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          prints.forEach((print) => print.setAttribute('aria-pressed', 'false'));
          document.activeElement?.blur?.();
        }
      });
    </script>
  </body>
</html>
