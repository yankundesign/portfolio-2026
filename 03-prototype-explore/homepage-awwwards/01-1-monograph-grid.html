<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>1.1 · Monograph on the grid — homepage prototype</title>
<!-- Prototype only. Not part of the deployed site. Serve from the repo root (launch config "prototypes"). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/base.css" />
<style>
  /* 01 Monograph set on the live plate: bleed frame, register marks, the
   * numbered 12-column ruling, and the paper wave grid under it. The name
   * and index lock to the columns; the notebook disturbs the paper. */
  :root {
    /* plate chrome, as in site/src/components/shared/EditorialPlate.module.css */
    --pm: 40px; --ci: 20px; --ct: 16px; --cb: 16px; --mh: 54px; --ng: 10px; --nr: 18px;
    --rule-plate: rgba(22, 38, 94, 0.16);
    --rule-plate-strong: rgba(22, 38, 94, 0.32);
    --f-top: calc(var(--pm) + var(--ct) + var(--mh) + var(--ng) + var(--nr));
    --f-bottom: calc(var(--pm) + var(--cb) + var(--mh) + var(--nr));
    --f-side: calc(var(--pm) + var(--ci));
    --name: min(17.5vw, 30vh);
  }

  /* a whisper of the desk light, so the wave's paper-lit edges have something to lift */
  .wash { position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 85% 70% at 8% 4%, rgba(221, 214, 194, 0.28), transparent 55%),
      linear-gradient(135deg, transparent 8%, rgba(22, 38, 94, 0.07) 100%); }

  .plate { position: fixed; inset: 0; z-index: 1; }
  .bleed { position: absolute; inset: var(--pm); border: 1px solid var(--rule-plate); pointer-events: none; }
  .reg { position: absolute; width: 14px; height: 14px; color: var(--rule-plate-strong); pointer-events: none; }
  .reg svg { display: block; }
  .reg.tl { top: calc(var(--pm) - 7px); left: calc(var(--pm) - 7px); }
  .reg.tc { top: calc(var(--pm) - 7px); left: 50%; translate: -50% 0; }
  .reg.tr { top: calc(var(--pm) - 7px); right: calc(var(--pm) - 7px); }
  .reg.bl { bottom: calc(var(--pm) - 7px); left: calc(var(--pm) - 7px); }
  .reg.bc { bottom: calc(var(--pm) - 7px); left: 50%; translate: -50% 0; }
  .reg.br { bottom: calc(var(--pm) - 7px); right: calc(var(--pm) - 7px); }

  .meta { position: absolute; display: grid; gap: 5px; color: var(--ink-soft); }
  .meta.tl { top: calc(var(--pm) + var(--ct)); left: var(--f-side); }
  .meta.tr { top: calc(var(--pm) + var(--ct)); right: var(--f-side); text-align: right; }
  .meta.bl { bottom: calc(var(--pm) + var(--cb)); left: var(--f-side); }
  .meta.br { bottom: calc(var(--pm) + var(--cb)); right: var(--f-side); text-align: right; }

  /* Column numbers: the one under the cursor comes up in ink */
  .cols-n { position: absolute; top: calc(var(--pm) + var(--ct) + var(--mh) + var(--ng)); left: var(--f-side); right: var(--f-side);
    display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; }
  .cols-n span { justify-self: center; position: relative; color: var(--ink-soft); opacity: 0.72; transition: color 200ms, opacity 200ms; }
  .cols-n span::after { content: ''; position: absolute; top: calc(100% + 4px); left: 50%; width: 1px; height: 10px; background: var(--rule-plate); transition: background 200ms; }
  .cols-n span.on { color: var(--ink); opacity: 1; }
  .cols-n span.on::after { background: var(--ink); }

  .field { position: absolute; top: var(--f-top); bottom: var(--f-bottom); left: var(--f-side); right: var(--f-side); pointer-events: none; }
  .field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; color: var(--ink); }
  .field svg.rules { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rules line { stroke: var(--rule-plate); stroke-width: 1; vector-effect: non-scaling-stroke; shape-rendering: crispEdges; }

  /* The name, locked to the columns: Yankun starts on col 1; Wang ends on col 12 */
  .name { position: absolute; inset: 0; pointer-events: none; font-weight: 300; z-index: 2; }
  .line {
    position: absolute; display: block; white-space: nowrap;
    font-size: var(--name); line-height: 1; letter-spacing: -0.045em;
    font-variation-settings: 'opsz' 144, 'SOFT' 0, 'WONK' 1;
    clip-path: inset(-0.1em -0.2em -0.3em -0.2em);
    transition: transform 1000ms var(--ease-paper), opacity 700ms var(--ease-paper);
  }
  .line .ch { display: inline-block; }
  .l1 { left: calc(var(--f-side) - 0.055em); top: calc(var(--f-top) - 0.02em); }
  .l2 { right: calc(var(--f-side) - 0.02em); bottom: calc(var(--f-bottom) - 0.2em); font-style: italic; }

  /* Notebook: centred on columns 5–8 */
  .slot {
    position: absolute; left: 50%; top: calc(var(--f-top) + (100vh - var(--f-top) - var(--f-bottom)) / 2);
    height: min(56vh, 60vw); aspect-ratio: var(--nb-aspect, 0.7395); translate: -50% -50%;
    border-radius: 6px; cursor: pointer; z-index: 3;
  }

  /* Pages as column captions: one link per column (cols 1–4), no
   * horizontal rules, so the grid holds them instead of boxing them in.
   * Each caption hangs from a short ink tick on its column rule, like the
   * plate's fig. marks. */
  .cols-nav {
    position: absolute; z-index: 3; left: var(--f-side); top: calc(50% + 1vh);
    width: calc((100vw - 2 * var(--f-side)) * 4 / 12);
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .cn { position: relative; display: grid; align-content: start; gap: 12px; padding: 18px 12px 22px 13px; min-height: 150px; text-align: left; }
  .cn::before { content: ''; position: absolute; left: 0; top: 0; width: 16px; height: 1px; background: var(--ink); }
  .cn::after { content: ''; position: absolute; inset: 0 0 0 1px; background: rgba(22, 38, 94, 0.035); opacity: 0; transition: opacity 240ms var(--ease-out); }
  .cn .n { color: var(--ink-soft); }
  .cn .lbl { position: relative; justify-self: start; font-family: var(--serif); font-size: 22px; font-weight: 350; line-height: 1.1; letter-spacing: -0.01em; font-variation-settings: 'opsz' 24; }
  .cn .lbl::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: 0 50%; transition: transform 380ms var(--ease-out); }
  .cn .go { color: var(--ink-soft); transition: color var(--hover), transform 240ms var(--ease-out); justify-self: start; }
  .cn:is(:hover, :focus-visible)::after { opacity: 1; }
  .cn:is(:hover, :focus-visible) .lbl::after { transform: scaleX(1); }
  .cn:is(:hover, :focus-visible) .go { color: var(--ink); transform: translateX(3px); }
  .cn:is(:hover, :focus-visible) .n { color: var(--ink); }
  .cn:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -2px; }

  .aside { position: absolute; right: var(--f-side); top: calc(var(--f-top) + 18px); z-index: 3; text-align: right; display: grid; gap: 6px; color: var(--ink-soft); }

  .peek {
    position: fixed; left: 0; top: 0; width: 190px; z-index: 20; pointer-events: none;
    border: 1px solid var(--ink); background: var(--paper); padding: 8px 8px 30px;
    box-shadow: 0 18px 30px rgba(22, 38, 94, 0.18); opacity: 0; transition: opacity 200ms var(--ease-out);
  }
  .peek img { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .peek span { position: absolute; left: 10px; bottom: 9px; }
  .peek.on { opacity: 1; }

  /* Choreography: the plate stays; its type and labels step back */
  .meta, .cols-n, .cols-nav, .aside { transition: opacity 360ms var(--ease-paper); }
  html.nb-open .meta, html.nb-open .cols-n, html.nb-open .cols-nav, html.nb-open .aside { opacity: 0; pointer-events: none; }
  html.nb-open .l1 { transform: translateX(-38vw); opacity: 0; }
  html.nb-open .l2 { transform: translateX(38vw); opacity: 0; }
  html.rm.nb-open .l1, html.rm.nb-open .l2 { transform: none; }

  /* Intro: rulings draw, then the paper ripples once, then the name rises */
  .rules line { transition: transform 1100ms var(--ease-paper); transform-box: fill-box; }
  .intro .rules line.h { transform: scaleX(0); transform-origin: 0 50%; }
  .intro .rules line.v { transform: scaleY(0); transform-origin: 50% 0; }
  .intro .ch { transform: translateY(110%); }
  .intro .meta, .intro .cols-n, .intro .cols-nav, .intro .aside, .intro .book-layer, .intro .bleed, .intro .reg { opacity: 0; }
  .bleed, .reg { transition: opacity 600ms var(--ease-paper); }
  .book-layer { transition: opacity 700ms var(--ease-paper); }
</style>
</head>
<body class="intro">
<div class="wash" aria-hidden="true"></div>

<main class="plate">
  <div class="field" aria-hidden="true"><canvas></canvas><svg class="rules"></svg></div>
  <div class="bleed" aria-hidden="true"></div>
  <span class="reg tl" aria-hidden="true"></span><span class="reg tc" aria-hidden="true"></span><span class="reg tr" aria-hidden="true"></span>
  <span class="reg bl" aria-hidden="true"></span><span class="reg bc" aria-hidden="true"></span><span class="reg br" aria-hidden="true"></span>

  <div class="meta tl mono"><span>Yankun Wang</span><span>Senior product designer</span></div>
  <div class="meta tr mono"><span>San Francisco · 2026</span><span>Field notebook · Vol. V</span></div>
  <div class="cols-n mono" aria-hidden="true"></div>
  <div class="meta bl mono"><span>Plate 01 · Desk</span><span>12 columns</span></div>

  <h1 class="name" aria-label="Yankun Wang">
    <span class="line l1" aria-hidden="true">Yankun</span>
    <span class="line l2" aria-hidden="true">Wang</span>
  </h1>

  <button class="slot" type="button" aria-expanded="false" aria-label="Open the notebook: selected work"></button>

  <nav class="cols-nav" aria-label="Pages">
    <button class="cn" type="button" data-open><span class="n mono">01</span><span class="lbl">Works</span><span class="go mono">Open →</span></button>
    <a class="cn" href="../../site/public/Yankun-Wang-CV-2026.pdf" target="_blank" rel="noopener"><span class="n mono">02</span><span class="lbl">Résumé</span><span class="go mono">PDF ↗</span></a>
    <a class="cn" href="https://yankun.design/about" target="_blank" rel="noopener" data-peek><span class="n mono">03</span><span class="lbl">About</span><span class="go mono">Read →</span></a>
    <a class="cn" href="mailto:yankunux@gmail.com"><span class="n mono">04</span><span class="lbl">Email</span><span class="go mono">Write ↗</span></a>
  </nav>
</main>

<div class="peek" aria-hidden="true"><img src="../../site/public/images/about/me.png" alt=""><span class="mono">Yankun, 2026</span></div>
<div class="grain" aria-hidden="true"></div>

<script src="shared/book.js"></script>
<script src="shared/wavegrid.js"></script>
<script src="shared/proto.js"></script>
<script>
(async () => {
const { Book, reduced, clamp, lerp } = window.NB;
const { createWaveGrid, DESK_WAVE } = window.NBWave;
const { protoChrome } = window.NBProto;

protoChrome({
  id: '1.1',
  job: '01’s name and notebook, set on the live site’s plate: the grid, the numbered columns and the paper that ripples.',
  refs: [
    ['Stameska', 'structure stays visible: the 12-column ruling is the stage, and the name locks to it (Yankun starts on col 1, Wang ends on col 12).'],
    ['Way of Living', 'one object at real scale; its shadow falls away from the cursor.'],
    ['Live desk (useWaveGrid)', 'the paper tiles under the ruling ripple with the pointer, ported 1:1. New: the notebook sends a ring through the plate when it opens and when it is set down.'],
  ],
  look: [
    'Move the cursor across the plate: the paper ripples, and the column number above you comes up in ink.',
    'Open the notebook: a ring runs out from under it as it lifts.',
    'Close it (tab, paper or Esc): a smaller ring when it lands.',
  ],
  changed: 'CV, About and Email sit with Works as captions in columns 1–4, held by the grid rather than a table. Footer lines are gone.',
});

const root = document.documentElement;
const slot = document.querySelector('.slot');

/* ── Plate chrome ── */
const RM = `<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0V14M0 7H14" stroke="currentColor" stroke-width="1"/><circle cx="7" cy="7" r="3.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>`;
document.querySelectorAll('.reg').forEach((r) => { r.innerHTML = RM; });
const nums = document.querySelector('.cols-n');
nums.innerHTML = Array.from({ length: 12 }, (_, i) => `<span>${i + 1}</span>`).join('');
const colEls = [...nums.children];

const field = document.querySelector('.field');
const rules = field.querySelector('svg.rules');
function drawRules() {
  const { width: w, height: h } = field.getBoundingClientRect();
  rules.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let s = `<line class="h" x1="0" y1="0.5" x2="${w}" y2="0.5"/><line class="h" x1="0" y1="${h - 0.5}" x2="${w}" y2="${h - 0.5}"/>`;
  for (let i = 0; i <= 12; i++) { const x = Math.min(w - 0.5, Math.max(0.5, Math.round((w * i) / 12) + 0.5)); s += `<line class="v" x1="${x}" y1="0" x2="${x}" y2="${h}" style="transition-delay:${120 + i * 40}ms"/>`; }
  rules.innerHTML = s;
}
drawRules();
addEventListener('resize', drawRules);

/* ── Wave grid (live desk parameters) ── */
const wave = reduced() ? null : createWaveGrid(field.querySelector('canvas'), DESK_WAVE, 12);

/* ── Name in letters ── */
const letters = [];
document.querySelectorAll('.line').forEach((line, li) => {
  const text = line.textContent;
  line.textContent = '';
  [...text].forEach((c) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c;
    line.appendChild(s);
    letters.push({ el: s, w: 300, soft: 0, line: li });
  });
});

const book = new Book({ slot, cover: 'archive' });
const open = () => book.open();
slot.addEventListener('click', open);
document.querySelector('[data-open]').addEventListener('click', open);

// The notebook disturbs the paper: a ring as it lifts, a smaller one as it lands.
const centre = () => { const r = slot.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
book.addEventListener('open-start', () => { wave?.dropAt(...centre(), { strength: 3.2, speed: 620 }); wave?.setEnabled(false); });
book.addEventListener('close', () => { wave?.setEnabled(true); wave?.dropAt(...centre(), { strength: 1.8, speed: 480 }); });

// Pointing at a page caption lifts its column's paper.
document.querySelectorAll('.cn').forEach((c) => c.addEventListener('pointerenter', () => {
  if (book.state !== 'closed') return;
  const r = c.getBoundingClientRect();
  wave?.dropAt(r.left + r.width / 2, r.top + r.height * 0.4, { strength: 1.3, speed: 420 });
}));

/* ── Pointer: lamp shadow, tilt, type, column ── */
let mx = innerWidth / 2, my = innerHeight * 0.4, inside = false;
addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; });
slot.addEventListener('pointerenter', () => { inside = true; });
slot.addEventListener('pointerleave', () => { inside = false; });

let lastCol = -1;
function frame() {
  const vw = innerWidth, vh = innerHeight;
  if (book.state === 'closed' && !reduced()) {
    const r = slot.getBoundingClientRect();
    const dx = (mx - (r.left + r.width / 2)) / vw, dy = (my - (r.top + r.height / 2)) / vh;
    book.target.lx = clamp(-dx * 70, -40, 40);
    book.target.ly = clamp(18 - dy * 30, 6, 34);
    book.target.tiltY = (inside ? 9 : 3) * clamp(dx * 2, -1, 1);
    book.target.tiltX = (inside ? -7 : -2) * clamp(dy * 2, -1, 1);
    book.target.lift = inside ? 0.025 : 0;
    book.target.blur = inside ? 30 : 22;
    book.target.shadow = inside ? 0.45 : 0.55;

    const R = vw * 0.2;
    for (const L of letters) {
      const b = L.el.getBoundingClientRect();
      const d = Math.hypot(mx - (b.left + b.width / 2), my - (b.top + b.height * 0.55));
      const f = Math.exp(-((d / R) ** 2));
      L.w = lerp(L.w, 300 + 330 * f, 0.14);
      L.soft = lerp(L.soft, 100 * f, 0.14);
      L.el.style.fontWeight = L.w.toFixed(1);
      L.el.style.fontVariationSettings = `'opsz' 144, 'SOFT' ${L.soft.toFixed(1)}, 'WONK' 1`;
    }

    const f = field.getBoundingClientRect();
    const col = mx >= f.left && mx <= f.right && my >= f.top - 60 && my <= f.bottom ? Math.min(11, Math.floor(((mx - f.left) / f.width) * 12)) : -1;
    if (col !== lastCol) { colEls[lastCol]?.classList.remove('on'); colEls[col]?.classList.add('on'); lastCol = col; }
  }
  requestAnimationFrame(frame);
}

/* ── About photo trails the cursor ── */
const peek = document.querySelector('.peek');
let px = 0, py = 0, pr = 0;
document.querySelector('[data-peek]').addEventListener('pointerenter', () => peek.classList.add('on'));
document.querySelector('[data-peek]').addEventListener('pointerleave', () => peek.classList.remove('on'));
(function trail() {
  const nx = lerp(px, mx + 28, 0.16), ny = lerp(py, my - 120, 0.16);
  pr = lerp(pr, clamp((nx - px) * 0.8, -10, 10), 0.2);
  px = nx; py = ny;
  peek.style.transform = `translate(${px}px, ${py}px) rotate(${pr}deg)`;
  requestAnimationFrame(trail);
})();

/* ── Intro: rulings draw → one ring from the centre → name rises, book settles ── */
await document.fonts.ready;
book.measure(); book.render();
book.cur.lift = 0.07; book.cur.shadow = 0; book.cur.blur = 40;
requestAnimationFrame(() => {
  document.body.classList.remove('intro');
  setTimeout(() => wave?.drop(0.5, 0.5, { strength: 6, speed: 700 }), 520);
  if (!reduced()) {
    letters.forEach((L, k) => {
      L.el.animate([{ transform: 'translateY(110%)' }, { transform: 'translateY(0)' }],
        { duration: 1100, delay: 520 + k * 55 + L.line * 140, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'backwards' });
    });
  }
  frame();
});
})();
</script>
</body>
</html>
