<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#7c5bff"/>
      <stop offset="55%" stop-color="#3b2a8a"/>
      <stop offset="100%" stop-color="#0f0a2c"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd9a6"/>
      <stop offset="100%" stop-color="#ff8b6b"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Crescent moon: full warm disc with offset cutout -->
  <mask id="cut">
    <rect width="64" height="64" fill="white"/>
    <circle cx="40" cy="22" r="14" fill="black"/>
  </mask>
  <circle cx="32" cy="28" r="14" fill="url(#moon)" mask="url(#cut)"/>
  <!-- Headphone arc -->
  <path d="M14 36 Q32 18 50 36" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <rect x="10" y="34" width="6" height="10" rx="2" fill="#fff" opacity="0.92"/>
  <rect x="48" y="34" width="6" height="10" rx="2" fill="#fff" opacity="0.92"/>
  <!-- Sound waves -->
  <path d="M20 50 Q24 46 28 50 T36 50 T44 50" fill="none" stroke="#ffd9a6" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
</svg>
