<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.78 0.22"
      numOctaves="4"
      seed="17"
      stitchTiles="stitch"
    />
    <feColorMatrix
      type="matrix"
      values="
        0 0 0 0 0.086
        0 0 0 0 0.149
        0 0 0 0 0.369
        0 0 0 0.035 0"
    />
  </filter>
  <filter id="long-fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.035 0.8"
      numOctaves="2"
      seed="42"
      stitchTiles="stitch"
    />
    <feColorMatrix
      type="matrix"
      values="
        0 0 0 0 0.086
        0 0 0 0 0.149
        0 0 0 0 0.369
        0 0 0 0.026 0"
    />
  </filter>
  <rect width="320" height="320" fill="#f4f1ea" opacity="0.06" />
  <rect width="320" height="320" filter="url(#paper-noise)" />
  <rect width="320" height="320" filter="url(#long-fibers)" opacity="0.35" />
</svg>
