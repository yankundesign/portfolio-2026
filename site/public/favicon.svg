<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The closed Field Notebook: the navy board (square at the spine, round at
       the fore-edge), the baseline its title sits on, and the ribbon's tail.
       On a dark tab bar it turns to paper with an ink rule. -->
  <style>
    .board, .tail { fill: #16265e; }
    .rule { stroke: #ebe6d9; }
    .spine { stroke: #0f1c46; }
    @media (prefers-color-scheme: dark) {
      .board, .tail { fill: #f4f1ea; }
      .rule { stroke: #16265e; }
      .spine { stroke: #ddd6c2; }
    }
  </style>
  <path class="tail" d="M10 27v4.5l1.25-1.1 1.25 1.1V27z"/>
  <path class="board" d="M6 2.5h17a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H6z"/>
  <path class="spine" d="M8.5 2.5v25" fill="none" stroke-width="1"/>
  <path class="rule" d="M12.5 21.5h9.5" fill="none" stroke-width="1.5" stroke-linecap="round"/>
</svg>
