<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The closed notebook. PNG for browsers that don't take an SVG icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Each route sets its own title once the app runs (titleFor in App.tsx). -->
    <title>Yankun Wang — Senior product designer</title>
    <meta name="description" content="Six years designing enterprise tools has convinced me the interesting work is almost always the same work — making complicated systems legible to the people who live inside them." />

    <!-- Link previews (X, LinkedIn, Slack, iMessage, Discord). Crawlers don't run JS,
         so these stay static: every route shares the homepage preview. og:url and
         canonical are left out on purpose — a static "/" would fold every route
         into the homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yankun Wang" />
    <meta property="og:title" content="Yankun Wang — Designer &amp; Builder" />
    <meta property="og:description" content="Six years designing enterprise tools has convinced me the interesting work is almost always the same work — making complicated systems legible to the people who live inside them." />
    <meta property="og:image" content="https://yankun.design/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The portfolio's homepage: the name Yankun Wang at poster scale in ink blue on paper, with a navy cloth Field Notebook, Selected work 2020–2026, standing in front of it." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are self-hosted (public/fonts, @font-face in src/styles/typography.css).
         The three faces the homepage draws first are fetched early. -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="281f772e-65d0-4a71-b165-d90a8aed581e" data-domains="yankun.design,www.yankun.design,yankun-portfolio.pages.dev" data-exclude-hash="true"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
