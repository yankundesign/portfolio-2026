<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#cfd3cf;overflow:hidden}
  #vp{position:relative;width:1280px;height:800px;overflow:hidden;background:#cfd3cf}
  .world{position:absolute;left:0;top:0;width:1920px;height:1200px;transform-origin:0 0;will-change:transform}
  .abs{position:absolute;left:0;top:0}
  img{display:block}
  .grp{position:absolute}
</style></head>
<body>
<div id="vp">
  <div class="world" id="w">
    <img class="abs" id="bg" src="layers/bg.png" width="1920" height="1200">
    <div class="grp" id="GL"><img class="abs" src="layers/phoneL.png"></div>
    <div class="grp" id="GR"><img class="abs" src="layers/phoneR.png"></div>
  </div>
</div>
<script>
const M = META_JSON;
const $=id=>document.getElementById(id);
const px=v=>v+'px';
function mk(parent,tag,css,src){const e=document.createElement(tag); e.style.position='absolute'; Object.assign(e.style,css||{}); if(src) e.src=src; parent.appendChild(e); return e;}
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

// groups at their crop origins; children use cover coords minus origin
const [lx,ly,lw,lh]=M.phoneL, [rx,ry,rw,rh]=M.phoneR;
Object.assign($('GL').style,{left:px(lx),top:px(ly),width:px(lw),height:px(lh)});
Object.assign($('GR').style,{left:px(rx),top:px(ry),width:px(rw),height:px(rh)});
const GL=$('GL'), GR=$('GR');

// right phone: wave
const [wx0,wy0,wx1,wy1]=M.wave;
const wpatch=mk(GR,'img',{left:px(wx0-rx),top:px(wy0-ry),width:px(wx1-wx0),height:px(wy1-wy0)},'layers/wave-patch.png');
const wave=mk(GR,'img',{left:px(wx0-rx),top:px(wy0-ry),width:px(wx1-wx0),height:px(wy1-wy0),transformOrigin:`${1186-wx0}px 50%`},'layers/wave.png');
const dot=mk(GR,'div',{width:'4px',height:'4px',borderRadius:'50%',background:rgb(M.redColor),opacity:0});
const newTick=mk(GR,'div',{left:px(1163-rx),top:px(754-ry),width:'1.4px',height:'16px',background:rgb(M.tickColor),transformOrigin:'50% 100%',opacity:0});
const [ux0,uy0,ux1,uy1]=M.turnBack;
const underline=mk(GR,'div',{left:px(ux0-rx),top:px(uy0-ry),width:px(ux1-ux0),height:'1.5px',background:'#1b1a17',opacity:0,transformOrigin:'0 0'});

// left phone: record
const [qx0,qy0,qx1,qy1]=M.rec;
mk(GL,'img',{left:px(qx0-lx),top:px(qy0-ly),width:px(qx1-qx0),height:px(qy1-qy0)},'layers/rec-patch.png');
const bars=M.bars.map(([x0,x1,y0,y1],i)=>mk(GL,'div',{left:px(x0-lx),top:px(y0-ly),width:px(x1-x0+1),height:px(y1-y0+1),
  background:i===M.bars.length-1?'rgb(22,21,15)':'rgb(122,120,115)'}));
const up=M.bars.map(([x0,x1,y0,y1])=>y0<330);

// easing
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const inOutCubic=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const inOutSine=u=>-(Math.cos(Math.PI*u)-1)/2;
const outCubic=u=>1-Math.pow(1-u,3);
const inCubic=u=>u*u*u;
const outBackSoft=u=>{const c1=0.9,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};

// camera
const H={x:960,y:600,z:1};
const R={x:1236,y:690,z:1.55}, R1={x:1240,y:700,z:1.6};
const Lk={x:640,y:420,z:1.6}, L1={x:636,y:424,z:1.66};
const R2={x:1236,y:704,z:1.45};
function camLerp(A,B,u,hop=0){return {x:lerp(A.x,B.x,u),y:lerp(A.y,B.y,u),z:Math.exp(lerp(Math.log(A.z),Math.log(B.z),u)-hop*Math.sin(Math.PI*u))};}
function camera(t){
  if(t<0.4) return H;
  if(t<1.4) return camLerp(H,R,inOutCubic(prog(t,0.4,1.4)));
  if(t<2.2) return camLerp(R,R1,inOutSine(prog(t,1.4,2.2)));
  if(t<3.1) return camLerp(R1,Lk,inOutCubic(prog(t,2.2,3.1)),0.16);
  if(t<3.9) return camLerp(Lk,L1,inOutSine(prog(t,3.1,3.9)));
  if(t<4.8) return camLerp(L1,R2,inOutCubic(prog(t,3.9,4.8)),0.12);
  if(t<6.0) return camLerp(R2,H,inOutCubic(prog(t,4.8,6.0)));
  return H;
}
const K=1280/1920;
function render(t){
  t=((t%6)+6)%6;
  const c=camera(t);
  // two slow breaths across the loop: the whole page inhales and exhales
  const breath=1+0.012*(1-Math.cos(2*Math.PI*t/3))/2;
  const s=c.z*breath*K;
  $('w').style.transform=`translate(${640-c.x*s}px,${400-c.y*s}px) scale(${s})`;
  // the painting drifts a touch slower than the phones: depth without parallax gymnastics
  const bs=1+0.006*(1-Math.cos(2*Math.PI*t/3))/2;
  $('bg').style.transform=`translate(${((c.x-960)*0.035).toFixed(2)}px,${((c.y-600)*0.035).toFixed(2)}px) scale(${bs})`;
  $('bg').style.transformOrigin='960px 600px';

  // rack focus
  const bL = t<2.6 ? inOutCubic(prog(t,0.6,1.3))*(1-inOutCubic(prog(t,2.2,2.8))) : inOutCubic(prog(t,4.0,4.6))*(1-inOutCubic(prog(t,5.2,6.0)));
  const bR = inOutCubic(prog(t,2.4,3.1))*(1-inOutCubic(prog(t,3.9,4.5)));
  GL.style.filter=bL>0.005?`blur(${(1.7*bL).toFixed(3)}px)`:'';
  GR.style.filter=bR>0.005?`blur(${(1.7*bR).toFixed(3)}px)`:'';

  // Turn back: pencil-weight press on the underline
  const press = outCubic(prog(t,1.3,1.5))*(1-prog(t,2.4,2.8));
  underline.style.opacity=press.toFixed(3);
  underline.style.transform=`scaleY(${(1+press).toFixed(3)})`;

  // the wave folds into a mark on the line
  const fold=inOutCubic(prog(t,1.6,2.15));
  const revealing = t>=4.3;
  if(!revealing){
    wave.style.clipPath='none';
    wave.style.transform=`scaleX(${(1-fold).toFixed(4)})`;
    wave.style.opacity=(1-inCubic(fold)).toFixed(3);
    wpatch.style.opacity=fold>0?1:0;
  } else {
    const u=inOutSine(prog(t,4.35,5.75));
    const edge=1186+u*(1397-1186);
    const vis=(edge-wx0)/(wx1-wx0);
    wave.style.transform='none'; wave.style.opacity=u>0?1:0;
    wave.style.clipPath=`inset(0 ${(100-vis*100).toFixed(3)}% 0 0)`;
    wpatch.style.opacity=u<1?1:0;
    const i=Math.min(M.curve.ys.length-1,Math.max(0,Math.round(edge-1186)));
    const dy=M.curve.ys[i];
    dot.style.left=px(edge-rx-2); dot.style.top=px(dy-ry-2);
    dot.style.opacity=(u>0&&u<1)?1:0;
  }
  if(!revealing) dot.style.opacity=0;
  const tickIn=outBackSoft(prog(t,1.95,2.3))*(1-prog(t,3.0,3.35));
  newTick.style.opacity=clamp(tickIn*1.5).toFixed(3);
  newTick.style.transform=`scaleY(${Math.max(0,tickIn).toFixed(4)})`;

  // left record: newest mark lands, a breath runs along the line
  const n=bars.length;
  bars.forEach((b,i)=>{
    let dy=0, op=1;
    const u=prog(t,3.3+i*0.055,3.85+i*0.055);
    dy=(up[i]?-1:1)*4.5*Math.sin(Math.PI*u);
    if(i===n-1){
      const out=prog(t,2.45,2.62), inn=prog(t,3.15,3.6);
      op = t<3.15 ? 1-out : clamp(inn*2);
      dy += t<3.15 ? 0 : -36*(1-outBackSoft(inn));
      if(t>=2.62 && t<3.15) op=0;
    }
    b.style.transform=`translateY(${dy.toFixed(3)}px)`;
    b.style.opacity=op.toFixed(3);
  });
}
window.render=render; render(0);
</script>
</body></html>
